services:
  n8n:
    image: n8nio/n8n:2.37.1
    command: execute --id=xbstack-n8n-task-runner-timeout-repro
    environment:
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: test
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: "15"
    volumes:
      - xbstack_task_runner_repro_data:/home/node/.n8n
  task-runners:
    image: n8nio/runners:2.37.1
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: test
    depends_on:
      - n8n
volumes:
  xbstack_task_runner_repro_data:
    external: true
